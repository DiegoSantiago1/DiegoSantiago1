  <title id="t">Stack de tecnologias</title>
  <desc id="d">Usados em projetos: SQL, PostgreSQL, Python, Pandas, NumPy, Power BI, dbt, PySpark, Delta Lake, Excel, LLM + tool calling, Saída estruturada (zod), Avaliação de IA, Node.js, Express, TypeScript, APIs REST, React, Vite, Tailwind CSS, HTML · CSS · JS, Docker, GitHub Actions, Git &amp; GitHub, Render, pytest · node:test. Em estudo: AWS.</desc>
